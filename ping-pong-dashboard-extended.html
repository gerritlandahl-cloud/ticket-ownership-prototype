        .stat-label {

        .stat-value {

        .metric-value {

        .timeline::before {

            position: absolute;
            left: 12px;
            top: 8px;
            bottom: 8px;
            width: 2px;
            background: #e0e0e0;
        }

        .timeline-item {
            position: relative;
            margin-bottom: 24px;
        }

            content: '';
            position: absolute;
            left: -32px;
            top: 6px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #667eea;
            border: 2px solid white;

            background: #EF5350;

            box-shadow: 0 0 0 2px #FFA726;
        }

            padding: 16px;

            .stats-bar {

            .controls {
                flex-direction: column;
                align-items: stretch;
            }

                flex-direction: column;
            }

                            targetTeam: 'Service Desk L1',
                            quality: 'low'
                        }
                    },
                    { 
                        team: 'File Services', 
                        date: '2026-01-23 10:15', 
                        action: 'Weitergeleitet',
                        reason: {
                            category: 'Eskalation',
                            description: 'AD-Berechtigungen prüfen',
                            attemptedSolution: 'Share-Permissions geprüft, sind korrekt',
                            targetTeam: 'File Services',
                            quality: 'medium'
                        }
                    },
                    { 
                        team: 'Service Desk L1', 
                        date: '2026-01-25 14:30', 
                        action: 'Zurückgewiesen (B→A→B)', 
                        loop: true,
                        reason: {
                            category: 'Nicht zuständig',
                            description: 'Das ist AD Problem',
                            attemptedSolution: null, // MISSING!
                            targetTeam: 'Service Desk L1',
                            quality: 'low'
                        }
                    },
                    { 
                        team: 'Active Directory Team', 
                        date: '2026-01-28 08:00', 
                        action: 'Weitergeleitet',
                        reason: {
                            category: 'Zuständigkeit',
                            description: 'Active Directory Team muss Berechtigungen setzen',
                            attemptedSolution: 'User-Account geprüft, ist aktiv',
                            targetTeam: 'Active Directory Team',
                            quality: 'medium'
                        }
                    }
                ],
                currentTeam: 'Active Directory Team',
                criticalCount: 4,
                decisionType: 'type-c',
                decisionLabel: 'Typ C – Eingreifen',
                reasoningQuality: 35
            },
            {
                id: 'TICKET-4823',
                title: 'Outlook kann keine Anhänge öffnen',
                transfers: 2,
                loops: 0,
                age: 6,
                ageCategory: 'critical',
                ownership: 'normal',
                history: [
                    { 
                        team: 'Service Desk L1', 
                        date: '2026-01-25 08:30', 
                        action: 'Ticket erstellt',
                        reason: null
                    },
                    { 
                        team: 'Mail Team', 
                        date: '2026-01-25 10:00', 
                        action: 'Weitergeleitet',
                        reason: {
                            category: 'Zuständigkeit',
                            description: 'Outlook/Mail-bezogenes Problem',
                            attemptedSolution: 'Office Reparatur durchgeführt, ohne Erfolg',
                            targetTeam: 'Mail Team',
                            quality: 'high'
                        }
                    },
                    { 
                        team: 'Application Support', 
                        date: '2026-01-27 14:20', 
                        action: 'Weitergeleitet',
                        reason: {
                            category: 'Zuständigkeit',
                            description: 'Anhänge sind Office-Dateien, könnte Application-Problem sein',
                            attemptedSolution: 'Mail-Server-Logs geprüft, keine Fehler bei Zustellung',
                            targetTeam: 'Application Support',
                            quality: 'high'
                        }
                    }
                ],
                currentTeam: 'Application Support',
                criticalCount: 2,
                decisionType: 'type-b',
                decisionLabel: 'Typ B – Klären',
                reasoningQuality: 90
            }
        ];

        let currentTickets = [...demoTickets];
        let currentMode = 'demo';

        // Initiales Rendering
        renderTickets();
        updateStats();

        function switchMode(mode) {
            currentMode = mode;
            renderTickets();
            updateStats();
        }

        function renderTickets() {
            const container = document.getElementById('ticketList');
            
            if (currentTickets.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 60px 20px; color: #999;">
                        <div style="font-size: 64px; margin-bottom: 16px; opacity: 0.3;">📋</div>
                        <div style="font-size: 18px; margin-bottom: 8px;">Keine auffälligen Tickets gefunden</div>
                        <div style="font-size: 14px; color: #bbb;">Alle Tickets laufen im normalen Rahmen</div>
                    </div>
                `;
                return;
            }

            container.innerHTML = currentTickets.map(ticket => {
                const lastTransfer = ticket.history.filter(h => h.reason).pop();
                const qualityClass = ticket.reasoningQuality >= 70 ? 'quality-high' : 
                                   ticket.reasoningQuality >= 50 ? 'quality-medium' : 'quality-low';
                
                return `
                    <div class="ticket-card ${ticket.decisionType}" onclick="showTicketDetails('${ticket.id}')">
                        <div class="ticket-header">
                            <div class="ticket-id">${ticket.id}</div>
                            <div class="ticket-badges">
                                <div class="ticket-badge ${ticket.decisionType}">${ticket.decisionLabel}</div>
                                <div class="ticket-badge ${qualityClass}">Qualität: ${ticket.reasoningQuality}%</div>
                            </div>
                        </div>
                        <div class="ticket-title">${ticket.title}</div>
                        
                        ${lastTransfer ? `
                            <div class="reason-preview ${lastTransfer.reason.quality === 'low' ? 'suspicious' : ''}">
                                <div class="reason-label">Letzte Weitergabe-Begründung:</div>
                                <div class="reason-text">"${lastTransfer.reason.description}"</div>
                            </div>
                        ` : ''}
                        
                        <div class="ticket-metrics">
                            <div class="metric ${ticket.transfers >= 3 ? 'critical' : ''}">
                                <span class="metric-icon">🔄</span>
                                <span class="metric-label">Weitergaben:</span>
                                <span class="metric-value">${ticket.transfers}</span>
                            </div>
                            <div class="metric ${ticket.loops > 0 ? 'critical' : ''}">
                                <span class="metric-icon">🔁</span>
                                <span class="metric-label">Schleifen:</span>
                                <span class="metric-value">${ticket.loops}</span>
                            </div>
                            <div class="metric ${ticket.ageCategory === 'critical' ? 'critical' : ''}">
                                <span class="metric-icon">⏰</span>
                                <span class="metric-label">Liegezeit:</span>
                                <span class="metric-value">${ticket.age} Tage</span>
                            </div>
                            <div class="metric">
                                <span class="metric-icon">👤</span>
                                <span class="metric-label">Aktuell:</span>
                                <span class="metric-value">${ticket.currentTeam}</span>
                            </div>
                        </div>
                        <div class="ticket-action">
                            <div class="action-label">${ticket.criticalCount} kritische Kriterien • ${countMissingReasons(ticket)} fehlende Begründungen</div>
                            <button class="action-btn" onclick="event.stopPropagation(); showTicketDetails('${ticket.id}')">Details anzeigen</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function countMissingReasons(ticket) {
            return ticket.history.filter(h => h.reason && !h.reason.attemptedSolution).length;
        }

        function updateStats() {
            const stats = {
                critical: currentTickets.filter(t => t.decisionType === 'type-c').length,
                warning: currentTickets.filter(t => t.decisionType === 'type-b').length,
                normal: currentTickets.filter(t => t.decisionType === 'type-a').length,
                avgQuality: Math.round(currentTickets.reduce((sum, t) => sum + t.reasoningQuality, 0) / currentTickets.length)
            };

            document.getElementById('stat-critical').textContent = stats.critical;
            document.getElementById('stat-warning').textContent = stats.warning;
            document.getElementById('stat-normal').textContent = stats.normal;
            document.getElementById('stat-quality').textContent = stats.avgQuality + '%';
        }

        function applyFilters() {
            const filterType = document.getElementById('filterType').value;
            const sortBy = document.getElementById('sortBy').value;

            let filtered = [...demoTickets];

            // Filter anwenden
            if (filterType === 'quality-low') {
                filtered = filtered.filter(t => t.reasoningQuality < 50);
            } else if (filterType !== 'all') {
                filtered = filtered.filter(t => t.decisionType === filterType);
            }

            // Sortierung anwenden
            if (sortBy === 'priority') {
                const priority = { 'type-c': 3, 'type-b': 2, 'type-a': 1 };
                filtered.sort((a, b) => priority[b.decisionType] - priority[a.decisionType]);
            } else if (sortBy === 'quality') {
                filtered.sort((a, b) => a.reasoningQuality - b.reasoningQuality);
            } else if (sortBy === 'transfers') {
                filtered.sort((a, b) => b.transfers - a.transfers);
            } else if (sortBy === 'age') {
                filtered.sort((a, b) => b.age - a.age);
            }

            currentTickets = filtered;
            renderTickets();
            updateStats();
        }

        function showTicketDetails(ticketId) {
            const ticket = demoTickets.find(t => t.id === ticketId);
            if (!ticket) return;

            document.getElementById('modalTicketId').textContent = ticket.id;
            
            const decisionContent = getDecisionContent(ticket);
            const missingReasons = countMissingReasons(ticket);
            
            document.getElementById('modalBody').innerHTML = `
                <div class="detail-section">
                    <h3>Ticket-Information</h3>
                    <div class="detail-grid">
                        <div class="detail-item">
                            <div class="detail-label">Ticket-Titel</div>
                            <div class="detail-value">${ticket.title}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Aktuelles Team</div>
                            <div class="detail-value">${ticket.currentTeam}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Begründungs-Qualität</div>
                            <div class="detail-value ${ticket.reasoningQuality < 50 ? 'critical' : ticket.reasoningQuality < 70 ? 'warning' : 'normal'}">${ticket.reasoningQuality}%</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Kritische Kriterien</div>
                            <div class="detail-value ${ticket.criticalCount >= 2 ? 'critical' : ''}">${ticket.criticalCount}</div>
                        </div>
                    </div>

                    ${missingReasons > 0 ? `
                        <div class="warning-box">
                            <div class="warning-icon">⚠️</div>
                            <div class="warning-text">
                                <strong>Fehlende Pflichtfelder:</strong> ${missingReasons} Weitergabe${missingReasons > 1 ? 'n' : ''} ohne vollständige Begründung. 
                                Das erschwert die Nachvollziehbarkeit und deutet auf unklare Ownership hin.
                            </div>
                        </div>
                    ` : ''}
                </div>

                <div class="detail-section">
                    <h3>Weitergabe-Historie mit Begründungen</h3>
                    <div class="timeline">
                        ${ticket.history.map((item, index) => {
                            const isSuspicious = item.reason && item.reason.quality === 'low';
                            const qualityClass = item.reason ? 
                                (item.reason.quality === 'high' ? 'high' : 
                                 item.reason.quality === 'medium' ? 'medium' : 'low') : '';
                            
                            return `
                                <div class="timeline-item ${item.loop ? 'loop' : ''} ${isSuspicious ? 'suspicious' : ''}">
                                    <div class="timeline-content ${item.loop ? 'loop' : ''} ${isSuspicious ? 'suspicious' : ''}">
                                        <div class="timeline-team">
                                            ${item.team}
                                            ${item.reason ? `<span class="quality-badge ${qualityClass}">${item.reason.quality}</span>` : ''}
                                        </div>
                                        <div class="timeline-action">${item.action}${item.loop ? ' ⚠️' : ''}</div>
                                        <div class="timeline-date">${item.date}</div>
                                        
                                        ${item.reason ? `
                                            <div class="timeline-reason-box ${!item.reason.attemptedSolution ? 'missing' : isSuspicious ? 'suspicious' : ''}">
                                                <div class="reason-field">
                                                    <div class="reason-field-label">Kategorie:</div>
                                                    <div class="reason-field-value">${item.reason.category}</div>
                                                </div>
                                                <div class="reason-field">
                                                    <div class="reason-field-label">Begründung:</div>
                                                    <div class="reason-field-value">${item.reason.description}</div>
                                                </div>
                                                <div class="reason-field">
                                                    <div class="reason-field-label">Versuchte Lösung: <span style="color: #EF5350;">*</span></div>
                                                    <div class="reason-field-value ${!item.reason.attemptedSolution ? 'missing' : ''}">
                                                        ${item.reason.attemptedSolution || '❌ FEHLT (Pflichtfeld!)'}
                                                    </div>
                                                </div>
                                                <div class="reason-field">
                                                    <div class="reason-field-label">Ziel-Team:</div>
                                                    <div class="reason-field-value">${item.reason.targetTeam}</div>
                                                </div>
                                                
                                                ${isSuspicious ? `
                                                    <div class="analysis-box">
                                                        <div class="analysis-title">🔍 Automatische Analyse</div>
                                                        <div class="analysis-text">
                                                            ${analyzeReason(item.reason)}
                                                        </div>
                                                    </div>
                                                ` : ''}
                                            </div>
                                        ` : index > 0 ? `
                                            <div class="timeline-reason-box missing">
                                                <div class="reason-field-value missing">
                                                    ❌ Keine Begründung erfasst (sollte Pflicht sein!)
                                                </div>
                                            </div>
                                        ` : ''}
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>

                <div class="detail-section">
                    <h3>Beispiel: Pflichtfelder bei Weitergabe (Mockup)</h3>
                    <div class="transfer-form-demo">
                        <h4>📝 Ticket weitergeben – Begründung erforderlich</h4>
                        
                        <div class="form-field">
                            <label>Kategorie der Weitergabe <span class="required">*</span></label>
                            <select disabled>
                                <option>Zuständigkeit (anderes Team ist verantwortlich)</option>
                                <option>Eskalation (höhere Expertise benötigt)</option>
                                <option>Nicht zuständig (fälschlich zugewiesen)</option>
                                <option>Weitere Informationen benötigt</option>
                            </select>
                        </div>

                        <div class="form-field">
                            <label>Begründung für Weitergabe <span class="required">*</span></label>
                            <textarea disabled placeholder="Warum wird dieses Ticket weitergegeben? Was ist der konkrete Grund?"></textarea>
                        </div>

                        <div class="form-field">
                            <label>Was wurde bereits versucht? <span class="required">*</span></label>
                            <textarea disabled placeholder="Welche Lösungsversuche wurden unternommen, bevor das Ticket weitergegeben wird?"></textarea>
                        </div>

                        <div class="form-field">
                            <label>Ziel-Team <span class="required">*</span></label>
                            <select disabled>
                                <option>Bitte wählen...</option>
                                <option>Service Desk L1</option>
                                <option>Network Team</option>
                                <option>Hardware Support</option>
                                <option>Application Support</option>
                            </select>
                        </div>

                        <div style="margin-top: 16px; padding: 12px; background: #e3f2fd; border-radius: 4px; font-size: 13px;">
                            💡 <strong>Hinweis:</strong> Alle Felder mit <span style="color: #EF5350;">*</span> sind Pflichtfelder. 
                            Das Ticket kann erst weitergegeben werden, wenn alle Informationen vollständig sind.
                        </div>
                    </div>
                </div>

                ${decisionContent}
            `;

            document.getElementById('ticketModal').classList.add('active');
        }

        function analyzeReason(reason) {
            const issues = [];
            
            if (!reason.attemptedSolution) {
                issues.push('Pflichtfeld "Versuchte Lösung" fehlt – unklar ob Troubleshooting stattfand');
            }
            
            if (reason.attemptedSolution === 'Nichts gemacht') {
                issues.push('Keine Lösungsversuche vor Weitergabe – deutet auf vorschnelle Weitergabe hin');
            }
            
            if (reason.description.length < 30) {
                issues.push('Sehr kurze Begründung – wenig Kontext für nächstes Team');
            }
            
            const vagueTerms = ['könnte', 'vielleicht', 'eventuell', 'möglicherweise'];
            if (vagueTerms.some(term => reason.description.toLowerCase().includes(term))) {
                issues.push('Unsichere Formulierung – Ownership nicht klar definiert');
            }
            
            return issues.length > 0 ? issues.join(' • ') : 'Begründung erscheint nachvollziehbar';
        }

        function getDecisionContent(ticket) {
            if (ticket.decisionType === 'type-c') {
                return `
                    <div class="detail-section">
                        <h3>Empfohlene Maßnahme</h3>
                        <div class="decision-box type-c">
                            <h4>🔴 Typ C – Sofort eingreifen</h4>
                            <p><strong>Was bedeutet das?</strong></p>
                            <p>Das Ticket zeigt mehrere kritische Warnsignale UND schlechte Begründungs-Qualität (${ticket.reasoningQuality}%). Du musst jetzt aktiv eingreifen.</p>
                            
                            <p><strong>Konkrete nächste Schritte:</strong></p>
                            <ol>
                                <li><strong>Ownership explizit festlegen:</strong> Weise das Ticket einem Team verbindlich zu</li>
                                <li><strong>Fehlende Begründungen nachfordern:</strong> Teams müssen erklären, warum sie Pflichtfelder nicht ausgefüllt haben</li>
                                <li><strong>Weitere Weitergaben stoppen:</strong> Keine Übergaben ohne deine Freigabe</li>
                                <li><strong>Prozess-Review:</strong> Warum wurden Pflichtfelder nicht ausgefüllt?</li>
                            </ol>

                            <p><strong>Warum diese Entscheidung?</strong></p>
                            <p>• ${ticket.criticalCount} kritische Kriterien identifiziert (inkl. ${ticket.loops} Schleife${ticket.loops > 1 ? 'n' : ''})<br>
                            • Begründungs-Qualität nur ${ticket.reasoningQuality}% (deutet auf unklare Ownership)<br>
                            • ${countMissingReasons(ticket)} Weitergabe${countMissingReasons(ticket) > 1 ? 'n' : ''} ohne vollständige Begründung</p>
                        </div>
                    </div>
                `;
            } else if (ticket.decisionType === 'type-b') {
                return `
                    <div class="detail-section">
                        <h3>Empfohlene Maßnahme</h3>
                        <div class="decision-box type-b">
                            <h4>🟡 Typ B – Aktiv klären</h4>
                            <p><strong>Was bedeutet das?</strong></p>
                            <p>Du solltest aktiv zwischen den beteiligten Teams klären, wer verantwortlich ist. Die Begründungs-Qualität (${ticket.reasoningQuality}%) ${ticket.reasoningQuality >= 70 ? 'ist gut, aber' : 'könnte besser sein und'} es gibt Klärungsbedarf.</p>
                            
                            <p><strong>Konkrete nächste Schritte:</strong></p>
                            <ol>
                                <li><strong>Begründungen prüfen:</strong> Schaue dir alle Weitergabe-Begründungen an</li>
                                <li><strong>Nachfragen bei unklaren Begründungen:</strong> Vor allem bei fehlenden Lösungsversuchen</li>
                                <li><strong>Vorläufige Ownership festlegen:</strong> Bestimme, welches Team jetzt führt</li>
                                <li><strong>Termin setzen:</strong> Spätestens in 24h soll Klarheit herrschen</li>
                            </ol>

                            <p><strong>Warum diese Entscheidung?</strong></p>
                            <p>• ${ticket.criticalCount} kritische Kriterien identifiziert<br>
                            ${ticket.loops > 0 ? `• ${ticket.loops} Schleife${ticket.loops > 1 ? 'n' : ''} erkannt (Ownership unklar)<br>` : ''}
                            ${countMissingReasons(ticket) > 0 ? `• ${countMissingReasons(ticket)} unvollständige Begründung${countMissingReasons(ticket) > 1 ? 'en' : ''}<br>` : ''}
                            • Begründungs-Qualität: ${ticket.reasoningQuality}%</p>
                        </div>
                    </div>
                `;
            } else {
                return `
                    <div class="detail-section">
                        <h3>Empfohlene Maßnahme</h3>
                        <div class="decision-box type-a">
                            <h4>🟢 Typ A – Beobachten</h4>
                            <p><strong>Was bedeutet das?</strong></p>
                            <p>Das Ticket zeigt noch keine kritischen Warnsignale. Die Begründungs-Qualität (${ticket.reasoningQuality}%) ist ${ticket.reasoningQuality >= 70 ? 'gut' : 'akzeptabel'}. Keine unmittelbare Intervention nötig.</p>
                            
                            <p><strong>Konkrete nächste Schritte:</strong></p>
                            <ol>
                                <li><strong>Ticket im Blick behalten:</strong> Prüfe in 24–48h erneut</li>
                                <li><strong>Begründungen monitoren:</strong> Achte darauf, dass Pflichtfelder ausgefüllt werden</li>
                                <li><strong>Keine Eskalation:</strong> Lass das Team arbeiten</li>
                            </ol>
                        </div>
                    </div>
                `;
            }
        }

        function closeModal() {
            document.getElementById('ticketModal').classList.remove('active');
        }

        // Modal schließen bei Klick außerhalb
        document.getElementById('ticketModal').addEventListener('click', (e) => {
            if (e.target.id === 'ticketModal') {
                closeModal();
            }
        });
    </script>
</body>
</html>
